# [IA] registro 4
name: Testes do projeto

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  testes:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.11'
          cache: pip
      - name: Instalar dependências
        run: python -m pip install -r requirements.txt
      - name: Conferir dependências
        run: python -m pip check
      - name: Obter os cinco CSVs públicos para os testes reais
        run: python scripts/baixar_dados.py
      - name: Verificar sintaxe
        run: python -m compileall -q src scripts pages app.py tests
      - name: Executar testes
        run: python -m pytest -q
